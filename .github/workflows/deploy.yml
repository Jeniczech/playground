name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jeniczech/playground

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: playground
          POSTGRES_PASSWORD: playground
          POSTGRES_DB: playground
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playground -d playground"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://playground:playground@localhost:5432/playground
      PAYLOAD_SECRET: ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Enable Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm payload migrate

      - name: Run lint
        run: pnpm lint

      - name: Run integration tests
        run: pnpm test:int

  build:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jeniczech/playground:${{ github.sha }}

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migration
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jeniczech/playground:migration-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/basecamp
          chmod 600 ~/.ssh/basecamp

          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload production Compose config
        run: |
          scp \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/basecamp \
            deploy/compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/apps/playground/compose.yml.new"

      - name: Deploy to Basecamp
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/basecamp \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -s' << 'EOF'
              set -e

              SHA="${{ github.sha }}"
              APP_DIR="/opt/apps/playground"

              echo "Deploying $SHA"

              cd "$APP_DIR"

              #
              # Validate the new Compose configuration before touching
              # the running application.
              #
              IMAGE_TAG="$SHA" \
                docker compose \
                --env-file .env \
                -f compose.yml.new \
                config --quiet

              #
              # Remember the image that is currently running.
              #
              PREVIOUS_IMAGE="$(
                IMAGE_TAG="$SHA" docker compose ps -q app \
                  | xargs -r docker inspect \
                    --format '{{.Config.Image}}'
              )"

              echo "Previous image: ${PREVIOUS_IMAGE:-none}"

              #
              # Pull immutable images for this release.
              #
              docker pull "ghcr.io/jeniczech/playground:migration-$SHA"
              docker pull "ghcr.io/jeniczech/playground:$SHA"

              #
              # Run database migrations.
              #
              docker run --rm \
                --network basecamp-network \
                --env-file "$APP_DIR/.env" \
                "ghcr.io/jeniczech/playground:migration-$SHA"

              #
              # Preserve the current Compose configuration for rollback,
              # then activate the new one.
              #
              if [ -f compose.yml ]; then
                cp compose.yml compose.yml.previous
              fi
            
              mv compose.yml.new compose.yml

              #
              # Start the new application.
              #
              IMAGE_TAG="$SHA" docker compose up -d

              APP_CONTAINER="$(IMAGE_TAG="$SHA" docker compose ps -q app)"

              echo "Waiting for application health..."

              HEALTHY=false

              for attempt in $(seq 1 24); do
                STATUS="$(
                  docker inspect \
                    --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                    "$APP_CONTAINER"
                )"

                echo "Health check $attempt/24: $STATUS"

                if [ "$STATUS" = "healthy" ]; then
                  HEALTHY=true
                  break
                fi

                if [ "$STATUS" = "unhealthy" ]; then
                  break
                fi

                sleep 5
              done

              if [ "$HEALTHY" = "true" ]; then
                rm -f compose.yml.previous
                echo "Deployment complete — application is healthy"
                exit 0
              fi

              echo "New application failed health check"

              #
              # Roll back to the Compose configuration and image
              # that were running before this deploy.
              #
              if [ -z "$PREVIOUS_IMAGE" ]; then
                echo "No previous image available for rollback"
                exit 1
              fi
          
              if [ ! -f compose.yml.previous ]; then
                echo "No previous Compose configuration available for rollback"
                exit 1
              fi

              PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"
          
              if ! printf '%s' "$PREVIOUS_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Refusing rollback: previous image is not tagged with an immutable Git SHA: $PREVIOUS_IMAGE"
                exit 1
              fi

              echo "Restoring previous Compose configuration"
              mv compose.yml.previous compose.yml

              echo "Rolling back to $PREVIOUS_IMAGE"
              IMAGE_TAG="$PREVIOUS_TAG" docker compose up -d

              ROLLBACK_CONTAINER="$(
                IMAGE_TAG="$PREVIOUS_TAG" docker compose ps -q app
              )"

              echo "Waiting for rollback health..."

              ROLLBACK_HEALTHY=false

              for attempt in $(seq 1 24); do
                STATUS="$(
                  docker inspect \
                    --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                    "$ROLLBACK_CONTAINER"
                )"

                echo "Rollback health check $attempt/24: $STATUS"

                if [ "$STATUS" = "healthy" ]; then
                  ROLLBACK_HEALTHY=true
                  break
                fi

                if [ "$STATUS" = "unhealthy" ]; then
                  break
                fi

                sleep 5
              done

              if [ "$ROLLBACK_HEALTHY" = "true" ]; then
                echo "Rollback successful — previous application restored"
                exit 1
              fi

              echo "ROLLBACK FAILED — application is unhealthy"
              exit 1
          EOF