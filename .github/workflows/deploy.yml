name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jeniczech/playground

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jeniczech/playground:latest
            ghcr.io/jeniczech/playground:${{ github.sha }}

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migration
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jeniczech/playground:migration
            ghcr.io/jeniczech/playground:migration-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/basecamp
          chmod 600 ~/.ssh/basecamp
          
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload production Compose config
        run: |
          scp \
            -i ~/.ssh/basecamp \
            deploy/compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/apps/playground/compose.yml.new"

      - name: Deploy to Basecamp
        run: |
          ssh \
            -i ~/.ssh/basecamp \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -s' << 'EOF'
              set -e
          
              SHA="${{ github.sha }}"
              APP_DIR="/opt/apps/playground"
          
              echo "Deploying $SHA"
          
              cd "$APP_DIR"
          
              # Validate the new production configuration before doing anything.
              IMAGE_TAG="$SHA" \
                docker compose \
                --env-file .env \
                -f compose.yml.new \
                config --quiet
          
              # Pull the exact images produced from this Git commit.
              docker pull "ghcr.io/jeniczech/playground:migration-$SHA"
              docker pull "ghcr.io/jeniczech/playground:$SHA"
          
              # Migrate the database before switching the application.
              docker run --rm \
                --network basecamp-network \
                --env-file "$APP_DIR/.env" \
                "ghcr.io/jeniczech/playground:migration-$SHA"
          
              # Migration succeeded. The new Compose config now becomes active.
              mv compose.yml.new compose.yml
          
              # Start the exact application version belonging to this commit.
              IMAGE_TAG="$SHA" docker compose up -d
          
              echo "Deployment complete"
          EOF